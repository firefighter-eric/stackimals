name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/stackimals-playwright-results
      - run: pnpm test:e2e:production
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/stackimals-playwright-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: ${{ runner.temp }}/stackimals-playwright-results
          retention-days: 7
